name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm install

      - name: Run full feature tests
        run: xvfb-run --auto-servernum node tests/test_all_features.mjs
        env:
          HEADLESS: 'true'

      - name: Run side panel tests
        run: xvfb-run --auto-servernum node tests/test_sidepanel.mjs
        env:
          HEADLESS: 'true'

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build extension archive
        run: |
          EXTNAME="my_browser_assistant-${GITHUB_REF_NAME#v}.zip"
          git archive --format=zip --output="$EXTNAME" HEAD
          echo "EXTNAME=$EXTNAME" >> $GITHUB_ENV

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ github.ref_name }}
          files: ${{ env.EXTNAME }}
          generate_release_notes: true